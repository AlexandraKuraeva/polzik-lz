# Минимальный API-шлюз вместо Kong/Envoy из официального supabase/docker.
# supabase-js обращается к SUPABASE_URL/rest/v1/..., а PostgREST слушает от корня,
# поэтому шлюз срезает префикс /rest/v1. Другие API Supabase (auth, storage, realtime)
# приложению не нужны и не поднимаются.
#
# Ключ проверяет сам PostgREST (JWT в Authorization), шлюз его не трогает.
# Наружу шлюз не публикуется — к нему ходит только контейнер app по внутренней сети.

server {
	listen 8000;

	# DNS докера: адрес rest определяется на каждый запрос, переживает перезапуск контейнера
	resolver 127.0.0.11 valid=10s;
	set $postgrest http://rest:3000;

	client_max_body_size 10m;

	location /rest/v1/ {
		rewrite ^/rest/v1/(.*)$ /$1 break;
		proxy_pass $postgrest;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location = /health {
		access_log off;
		return 200 'ok';
	}

	location / {
		return 404;
	}
}
